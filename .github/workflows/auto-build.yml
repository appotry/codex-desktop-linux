# Codex Desktop Linux 自动构建与发布
#
# 触发方式：
#   - 推送到 main 分支
#   - 每日 6:00 UTC 检测上游更新
#   - 手动触发 (workflow_dispatch)
#
# 版本检测：通过 DMG 的 ETag/Last-Modified 判断上游是否更新
# 构建产物：.deb / .rpm / .pkg.tar.zst
#
# 上游项目：https://github.com/ilysenko/codex-desktop-linux
# Fork 维护：https://github.com/appotry/codex-desktop-linux

name: Auto Build & Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'readme_zh.md'
      - '.gitignore'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build (skip version check)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPSTREAM_DMG_URL: https://persistent.oaistatic.com/codex-app-prod/Codex.dmg
  UPSTREAM_DMG_PATH: /tmp/codex-upstream-ci/Codex.dmg
  DMG_CACHE_SCHEMA_VERSION: v2

jobs:
  # ============================================================
  # 检测上游版本 / 决定是否构建
  # ============================================================
  detect:
    name: Check upstream version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      cache_key: ${{ steps.version.outputs.cache_key }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - uses: actions/checkout@v5

      - name: Capture upstream DMG metadata
        id: upstream
        run: |
          set -euo pipefail
          hf="$(mktemp)"; trap 'rm -f "$hf"' EXIT
          curl -fsSLI "$UPSTREAM_DMG_URL" > "$hf"
          lm="$(awk 'tolower($0)~/^last-modified:/{sub(/\r$/,"");sub(/^[^:]+: /,"");print;exit}' "$hf")"
          et="$(awk 'tolower($0)~/^etag:/{sub(/\r$/,"");sub(/^[^:]+: /,"");gsub(/"/,"");print;exit}' "$hf")"
          cl="$(awk 'tolower($0)~/^content-length:/{sub(/\r$/,"");sub(/^[^:]+: /,"");print;exit}' "$hf")"
          echo "last_modified=${lm:-unknown}" >> "$GITHUB_OUTPUT"
          echo "etag=${et:-no-etag}" >> "$GITHUB_OUTPUT"
          echo "content_length=${cl:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Check version & decide
        id: version
        run: |
          set -euo pipefail

          # 版本号格式：v<日期>.<运行号>（方便识别）
          DATE_TAG=$(date -u '+%Y%m%d')
          RUN_NUM=${{ github.run_number }}
          VER="${DATE_TAG}.${RUN_NUM}"

          # 用 ETag 作缓存 key（不用于版本号）
          ETAG="${{ steps.upstream.outputs.etag }}"
          [ -z "$ETAG" ] || [ "$ETAG" = "no-etag" ] && ETAG="${{ steps.upstream.outputs.last_modified }}"
          CACHE_KEY=$(echo "$ETAG" | sha256sum | cut -c1-16)

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "cache_key=$CACHE_KEY" >> "$GITHUB_OUTPUT"

          # 判断是否需要构建
          LAST_VER=""
          gh release view latest --json tagName --jq '.tagName' 2>/dev/null && \
            LAST_VER=$(gh release view latest --json tagName --jq '.tagName' 2>/dev/null || echo "")

          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "should_build=true"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "should_build=true"
          elif [ -z "$LAST_VER" ]; then
            echo "should_build=true"
          elif [ "$LAST_VER" != "$VER" ]; then
            echo "should_build=true"
          else
            echo "should_build=false"
          fi >> "$GITHUB_OUTPUT"

  # ============================================================
  # 构建应用
  # ============================================================
  build:
    name: Build app
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.build-app.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          bash scripts/install-deps.sh

      - name: Cache Codex.dmg
        id: dmg-cache
        uses: actions/cache@v4
        with:
          path: /tmp/codex-upstream-ci/Codex.dmg
          key: upstream-dmg-${{ env.DMG_CACHE_SCHEMA_VERSION }}-${{ needs.detect.outputs.cache_key }}

      - name: Download Codex.dmg
        if: steps.dmg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$UPSTREAM_DMG_PATH")"
          curl -fL --retry 3 -o "$UPSTREAM_DMG_PATH" "$UPSTREAM_DMG_URL"

      - name: Build app
        id: build-app
        run: |
          make build-app DMG=/tmp/codex-upstream-ci/Codex.dmg
          # 传递版本号给下游 job
          echo "version=${{ needs.detect.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-app
          path: codex-app/
          retention-days: 1

  # ============================================================
  # 打包 .deb（Debian/Ubuntu）
  # ============================================================
  package-deb:
    name: Package .deb
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-app
          path: codex-app/

      - name: Build .deb
        run: |
          PACKAGE_VERSION="${{ needs.build.outputs.version }}" ./scripts/build-deb.sh

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: codex-desktop-deb
          path: dist/*.deb
          retention-days: 90

  # ============================================================
  # 打包 .rpm（Fedora/RHEL/openSUSE）
  # ============================================================
  package-rpm:
    name: Package .rpm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install RPM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          rpmbuild --version

      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-app
          path: codex-app/

      - name: Build .rpm
        run: |
          PACKAGE_VERSION="${{ needs.build.outputs.version }}" ./scripts/build-rpm.sh

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: codex-desktop-rpm
          path: dist/*.rpm
          retention-days: 90

  # ============================================================
  # 打包 Arch Linux（通过 Docker）
  # ============================================================
  package-pacman:
    name: Package Arch
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-app
          path: codex-app/

      - name: Build Arch package
        run: |
          docker run --rm \
            -e PACKAGE_VERSION="${{ needs.build.outputs.version }}" \
            -v "$PWD:/work" -w /work \
            archlinux:base-devel \
            bash -lc '
              pacman -Syu --noconfirm --needed rust nodejs npm zstd sudo
              useradd -m builder
              chown -R builder:builder /work
              runuser -u builder -- bash -lc '"'"'
                PACKAGE_VERSION="$PACKAGE_VERSION" ./scripts/build-pacman.sh
              '"'"'
            '

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: codex-desktop-arch
          path: dist/*.pkg.tar.*
          retention-days: 90

  # ============================================================
  # 发布 Release
  # ============================================================
  release:
    name: Create Release
    needs: [build, package-deb, package-rpm, package-pacman]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: codex-desktop-*
          merge-multiple: true
          path: /tmp/release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: "Codex Desktop Linux ${{ needs.build.outputs.version }}"
          body: |
            ## Codex Desktop Linux ${{ needs.build.outputs.version }}

            🖥️ 支持平台：
            - **Debian/Ubuntu** → `.deb`
            - **Fedora/RHEL/openSUSE** → `.rpm`
            - **Arch/Manjaro** → `.pkg.tar.zst`

            自动构建于 $(date -u '+%Y-%m-%d %H:%M UTC')。

            ### 安装

            ```bash
            # Debian/Ubuntu
            sudo dpkg -i codex-desktop_*.deb

            # Fedora/RHEL
            sudo rpm -ivh codex-desktop-*.rpm

            # Arch/Manjaro
            sudo pacman -U codex-desktop-*.pkg.tar.zst
            ```

            首次启动后 Codex Desktop 会引导安装 Codex CLI。
          files: /tmp/release-artifacts/*
          draft: false
          prerelease: false
          make_latest: true
