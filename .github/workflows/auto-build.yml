# Codex Desktop Linux 自动构建与发布
#
# 触发方式：
#   - 推送到 main 分支
#   - 每日 6:00 UTC 检测上游更新
#   - 手动触发 (workflow_dispatch)
#
# 构建策略：同一 job 内完成 build + package，避免 artifact 传递问题

name: Auto Build & Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'readme_zh.md'
      - '.gitignore'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build (skip version check)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPSTREAM_DMG_URL: https://persistent.oaistatic.com/codex-app-prod/Codex.dmg
  UPSTREAM_DMG_PATH: /tmp/codex-upstream-ci/Codex.dmg
  DMG_CACHE_SCHEMA_VERSION: v2

jobs:
  # ============================================================
  # 构建 + 打包（统一 job，避免 artifact 传递）
  # ============================================================
  build-and-package:
    name: Build & Package
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        package:
          - deb
          - rpm
        # pacman 需 Docker，拆到独立 job

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev rpm
          bash scripts/install-deps.sh

      - name: Detect upstream version
        id: upstream
        run: |
          set -euo pipefail
          hf="$(mktemp)"; trap 'rm -f "$hf"' EXIT
          curl -fsSLI "$UPSTREAM_DMG_URL" > "$hf"
          lm="$(awk 'tolower($0)~/^last-modified:/{sub(/\r$/,"");sub(/^[^:]+: /,"");print;exit}' "$hf")"
          et="$(awk 'tolower($0)~/^etag:/{sub(/\r$/,"");sub(/^[^:]+: /,"");gsub(/"/,"");print;exit}' "$hf")"
          echo "last_modified=${lm:-unknown}" >> "$GITHUB_OUTPUT"
          echo "etag=${et:-no-etag}" >> "$GITHUB_OUTPUT"

          # 版本号
          DATE_TAG=$(date -u '+%Y%m%d')
          VER="${DATE_TAG}.${{ github.run_number }}"
          CACHE_KEY=$(echo "${et:-$lm}" | sha256sum | cut -c1-16)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "cache_key=$CACHE_KEY" >> "$GITHUB_OUTPUT"

      - name: Check if build is needed
        id: check
        run: |
          LAST_VER=""
          gh release view latest --json tagName --jq '.tagName' 2>/dev/null && \
            LAST_VER=$(gh release view latest --json tagName --jq '.tagName' 2>/dev/null || echo "")
          VER="${{ steps.upstream.outputs.version }}"

          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$LAST_VER" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$LAST_VER" != "$VER" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip build
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "Version unchanged (${{ steps.upstream.outputs.version }}), skipping."
          exit 0

      # ---- 构建 ----
      - name: Cache Codex.dmg
        id: dmg-cache
        uses: actions/cache@v4
        with:
          path: /tmp/codex-upstream-ci/Codex.dmg
          key: upstream-dmg-${{ env.DMG_CACHE_SCHEMA_VERSION }}-${{ steps.upstream.outputs.cache_key }}

      - name: Download Codex.dmg
        if: steps.dmg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$UPSTREAM_DMG_PATH")"
          curl -fL --retry 3 -o "$UPSTREAM_DMG_PATH" "$UPSTREAM_DMG_URL"

      - name: Build app
        run: make build-app DMG=/tmp/codex-upstream-ci/Codex.dmg

      - name: Upload built app for downstream packaging
        if: matrix.package == 'deb'
        uses: actions/upload-artifact@v4
        with:
          name: codex-app
          path: codex-app/
          retention-days: 1

      # ---- 打包 ----
      - name: Build ${{ matrix.package }} package
        run: |
          PACKAGE_VERSION="${{ steps.upstream.outputs.version }}" \
            ./scripts/build-${{ matrix.package }}.sh

      - name: Upload ${{ matrix.package }} package
        uses: actions/upload-artifact@v4
        with:
          name: codex-desktop-${{ matrix.package }}
          path: dist/*.${{ matrix.package }}
          retention-days: 90

  # ============================================================
  # Pacman 包（Docker Arch Linux，不阻塞 release）
  # ============================================================
  package-pacman:
    name: Build Pacman Package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    needs: [build-and-package]
    steps:
      - uses: actions/checkout@v5

      - name: Download built app
        uses: actions/download-artifact@v4
        with:
          name: codex-app
          path: codex-app

      - name: Get version
        id: ver
        run: |
          echo "version=$(date -u '+%Y%m%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build pacman package in Docker
        run: |
          docker run --rm \
            -e PACKAGE_VERSION="${{ steps.ver.outputs.version }}" \
            -v "$PWD:/work" -w /work \
            archlinux:base-devel \
            bash -lc '
              pacman -Syu --noconfirm --needed rust nodejs npm zstd sudo p7zip curl unzip
              useradd -m builder
              chown -R builder:builder /work
              runuser -u builder -- bash -lc "
                set -euo pipefail
                cargo build --release -p codex-update-manager
                PACKAGE_VERSION=\"$PACKAGE_VERSION\" ./scripts/build-pacman.sh
              "
            '

      - name: Upload pacman package
        uses: actions/upload-artifact@v4
        with:
          name: codex-desktop-pacman
          path: dist/*.pkg.tar.*
          retention-days: 90

  # ============================================================
  # AppImage 包（不阻塞 release）
  # ============================================================
  package-appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    needs: [build-and-package]
    steps:
      - uses: actions/checkout@v5

      - name: Download built app
        uses: actions/download-artifact@v4
        with:
          name: codex-app
          path: codex-app

      - name: Install appimagetool
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-$(uname -m).AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          /tmp/appimagetool --appimage-extract > /dev/null 2>&1
          sudo mv squashfs-root/AppRun /usr/local/bin/appimagetool

      - name: Get version
        id: ver
        run: |
          echo "version=$(date -u '+%Y%m%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        run: |
          PACKAGE_VERSION="${{ steps.ver.outputs.version }}" \
            ./scripts/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: codex-desktop-appimage
          path: dist/*.AppImage
          retention-days: 90

  # ============================================================
  # 发布 Release（收集 artifacts）
  # ============================================================
  release:
    name: Create Release
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs: [build-and-package, package-pacman, package-appimage]
    steps:
      - uses: actions/checkout@v5

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: codex-desktop-*
          merge-multiple: true
          path: /tmp/release-artifacts

      - name: Get version
        id: ver
        run: |
          # 从 artifacts 获取版本
          VER="$(date -u '+%Y%m%d').${{ github.run_number }}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "Codex Desktop Linux ${{ steps.ver.outputs.version }}"
          body: |
            ## Codex Desktop Linux ${{ steps.ver.outputs.version }}

            🖥️ 支持平台：
            - **Debian/Ubuntu** → `.deb`
            - **Fedora/RHEL/openSUSE** → `.rpm`
            - **Arch/Manjaro** → `.pkg.tar.zst`
            - **通用 Linux** → `.AppImage`（无需安装，直接运行）

            自动构建于 $(date -u '+%Y-%m-%d %H:%M UTC')。

            ### 安装

            ```bash
            # Debian/Ubuntu
            sudo dpkg -i codex-desktop_*.deb

            # Fedora/RHEL
            sudo rpm -ivh codex-desktop-*.rpm

            # Arch/Manjaro
            sudo pacman -U codex-desktop-*.pkg.tar.zst

            # 通用 Linux（AppImage）
            chmod +x codex-desktop-*.AppImage
            ./codex-desktop-*.AppImage
            ```

            首次启动后 Codex Desktop 会引导安装 Codex CLI。
          files: /tmp/release-artifacts/*
          draft: false
          prerelease: false
          make_latest: true
