# ============================================================================
# Sync upstream and rebuild releases branch.
#
# 设计（方案 B：上游为基线 + 补丁目录）：
#   - 本 workflow 定时拉取上游 main，合并到 releases 分支
#   - 合并后重新应用 appotry-patches/ 中的补丁
#   - 推送 releases 触发 auto-build.yml 自动构建并发布 Release
#
# 触发：
#   - schedule: 每 6 小时检查一次上游更新
#   - workflow_dispatch: 手动触发
#
# 注意：不要在 GitHub 网页上使用 "Sync fork" 按钮，它会把上游合并到
# 默认分支（releases），与补丁冲突。本 workflow 才是同步的正确方式。
# ============================================================================
name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: releases
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "appotry-sync-bot"
          git config user.email "appotry@users.noreply.github.com"

      - name: Reset to upstream and re-apply patches
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ilysenko/codex-desktop-linux.git
          git fetch upstream main

          # 策略：releases 永远等于 上游 main + 补丁。
          # reset 到上游最新（丢弃旧的补丁提交），再重新应用补丁，
          # 避免 merge 历史累积导致分支与上游无限分叉。
          # appotry-patches/ 只存在于 releases 分支，reset 会删除它，
          # 因此先备份到临时目录，reset 后再恢复。
          cp -a appotry-patches /tmp/appotry-patches
          git reset --hard upstream/main
          rm -rf appotry-patches
          mv /tmp/appotry-patches appotry-patches
          echo "RESET=1" >> "$GITHUB_ENV"

      - name: Apply appotry patches
        run: |
          bash appotry-patches/apply.sh

      - name: Commit and push
        env:
          # TOKEN: 用户配置的 PAT（含 workflow scope），用于推送
          # 含上游 workflow 文件变更的合并结果
          PUSH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short upstream/main)"
          git add -A
          git diff --cached --quiet && {
            echo "Patches already applied on latest upstream, nothing to commit."
            exit 0
          }
          git commit -m "chore: apply appotry patches on upstream ${SHA}"
          # reset-based 策略：我们是 releases 的权威重建方，
          # 用 --force-with-lease 推送（防止并发覆盖别人的新提交）。
          # actions/checkout 配置了 http.extraheader（GITHUB_TOKEN），
          # 它会覆盖 URL 中的 PAT 导致 workflow 权限失效。
          # 用 -c 覆盖为空 + oauth2: 前缀强制使用 PAT。
          git -c credential.helper= -c "http.https://github.com/.extraheader=" push \
            --force-with-lease \
            "https://oauth2:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" releases
          echo "Pushed merged upstream ${SHA} to releases."
