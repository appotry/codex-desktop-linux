# ============================================================================
# Sync upstream and rebuild releases branch.
#
# 设计（方案 B：上游为基线 + 补丁目录）：
#   - 本 workflow 定时拉取上游 main，合并到 releases 分支
#   - 合并后重新应用 appotry-patches/ 中的补丁
#   - 推送 releases 触发 auto-build.yml 自动构建并发布 Release
#
# 触发：
#   - schedule: 每 6 小时检查一次上游更新
#   - workflow_dispatch: 手动触发
#
# 注意：不要在 GitHub 网页上使用 "Sync fork" 按钮，它会把上游合并到
# 默认分支（releases），与补丁冲突。本 workflow 才是同步的正确方式。
# ============================================================================
name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: releases
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "appotry-sync-bot"
          git config user.email "appotry@users.noreply.github.com"

      - name: Merge upstream main
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ilysenko/codex-desktop-linux.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream already merged, nothing to do."
            exit 0
          fi

          # 我们的补丁文件上游不存在，merge 应无冲突；若有冲突则失败并提示人工处理
          git merge upstream/main --no-edit --allow-unrelated-histories
          echo "MERGED=1" >> "$GITHUB_ENV"

      - name: Verify push token
        if: env.MERGED == '1'
        env:
          PUSH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          # 诊断：确认 TOKEN 是 PAT 且有 workflows 权限。
          # classic PAT 的 scope 在响应头 x-oauth-scopes 中。
          echo "--- whoami ---"
          curl -s -D /tmp/headers -H "Authorization: Bearer ${PUSH_TOKEN}" \
            "https://api.github.com/user" | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print('login:', d.get('login', 'NOT-A-PAT'))"
          echo "--- x-oauth-scopes (classic PAT) ---"
          grep -i '^x-oauth-scopes:' /tmp/headers || echo "(无此头，可能是 fine-grained PAT 或 GITHUB_TOKEN)"
          echo "--- workflow write test ---"
          # 尝试写 workflow 文件，验证 workflows 权限
          curl -s -X PUT \
            -H "Authorization: Bearer ${PUSH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/.token-test" \
            -d '{"message":"token test","content":"dGVzdA=="}' \
            -o /tmp/wtest -w "write_http=%{http_code}\n"
          cat /tmp/wtest | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print('write_msg:', d.get('message','OK'))" 2>/dev/null || true
          # 清理测试文件
          curl -s -X DELETE \
            -H "Authorization: Bearer ${PUSH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/.token-test" \
            -o /dev/null -w "delete_http=%{http_code}\n" || true

      - name: Apply appotry patches
        if: env.MERGED == '1'
        run: |
          bash appotry-patches/apply.sh

      - name: Commit and push
        if: env.MERGED == '1'
        env:
          # TOKEN: 用户配置的 PAT（含 workflow scope），用于推送
          # 含上游 workflow 文件变更的合并结果
          PUSH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short upstream/main)"
          git add -A
          git diff --cached --quiet || \
            git commit -m "chore: merge upstream ${SHA} and re-apply patches"
          # 先拉远程最新 releases，rebase 后推送，避免并发下的 fetch-first 拒绝
          git fetch origin releases
          git rebase origin/releases || true
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" releases
          echo "Pushed merged upstream ${SHA} to releases."
